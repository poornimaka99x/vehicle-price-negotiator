# test (every PR/push) -> train + quality gate -> register in Azure ML -> deploy to Container Apps.
# Azure settings are repository variables written by infra/provision.sh. Login is OIDC, no secrets.
name: mlops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  train:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mape: ${{ steps.metrics.outputs.mape }}
      r2: ${{ steps.metrics.outputs.r2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: Retrain (executes the whole notebook)
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 vehicle_price.ipynb
      - name: Quality gate on the freshly trained model
        run: python -m pytest -q
      - id: metrics
        run: |
          python -c "
          from vehicle_model import PriceModel
          m = PriceModel.load('model/price_model.joblib').metrics
          print(f\"mape={m['test_mape']:.2f}\nr2={m['test_r2']:.3f}\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            model/
            results/
          retention-days: 7

  deploy:
    needs: train
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RG }}
      ACR: ${{ vars.AZURE_ACR }}
      IMAGE: ${{ vars.AZURE_ACR }}.azurecr.io/vehicle-price:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: model }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Register model
        run: |
          az extension add -n ml -y
          az ml model create -g "$RG" -w "${{ vars.AZURE_ML_WORKSPACE }}" \
            --name vehicle-price-model --type custom_model --path model \
            --tags git_sha=${{ github.sha }} test_mape=${{ needs.train.outputs.mape }} test_r2=${{ needs.train.outputs.r2 }}
      - name: Build and push image
        run: |
          az acr login -n "$ACR"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        run: |
          az containerapp update -g "$RG" -n "${{ vars.AZURE_CONTAINERAPP }}" --image "$IMAGE" -o none
      - name: Health check
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "${{ vars.AZURE_CONTAINERAPP }}" --query properties.configuration.ingress.fqdn -o tsv)
          # Scale-from-zero cold start can take a minute or two.
          curl -fsS --retry 20 --retry-delay 10 --retry-all-errors --max-time 30 "https://$fqdn/_stcore/health"
          echo "Deployed: https://$fqdn"
